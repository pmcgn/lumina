# Lumina example configuration.
# Environment variable references (dollar sign + curly braces around a name) are replaced before parsing,
# so secrets can stay out of this file. Full-line comments are not expanded.

locale: de            # de | en
timezone: Europe/Berlin   # used for "today"/"overdue" windows (default: server timezone)
theme:
  mode: auto          # auto | light | dark
  # style: flat         # flat (default) | glass (frosted blur, sheen, edge highlight) | holo (iridescent, neon edge); glass/holo are off in display.lite
  # accent: "#4f9cff"
  # Background picture per color scheme (both optional). A value is the name of an embedded
  # picture (file name without extension) or the path of your own file, e.g. one mounted into
  # the container (-v ./wallpapers:/wallpapers:ro). Formats: jpg, png, webp, avif, gif, svg.
  # Embedded light: dawn, mist, meadow   embedded dark: night, aurora, dusk
  # widgetOpacity: 0.8                 # opacity of the widget cards, 0.1..1 (default 1): the background shows through
  # background:
  #   light: dawn                      # name of an embedded picture
  #   dark: /wallpapers/evening.jpg    # or a file path

grid:
  columns: 6
  rows: 4

# How the dashboard behaves on a screen that is always on (all optional):
# display:
#   rotate:                       # cycle through the pages automatically
#     enabled: true
#     intervalSeconds: 30         # time per page
#     pauseSeconds: 60            # a touch pauses the rotation for this long
#   night:                        # evening/night mode (software only, the tablet's own
#     from: "23:00"               # screen and brightness are not controlled); times are
#     to: "06:00"                 # the tablet's local time and may span midnight
#     mode: dim                   # dim: darkens the dashboard (dim: 0.75 = how dark)
#     dim: 0.75                   # clock: shows only a clock, a touch wakes the dashboard
#     wakeSeconds: 30             #        for wakeSeconds
#   softReload: "03:30"           # daily page reload as a safety net for 24/7 operation
#                                 # (default 03:30, "" turns it off)
#   lite: false                   # no animations or shadows, for weak devices
#   transition:                   # animation between pages (all optional)
#     type: fade                  # fade (default) | fly | slide | crossfade | scale | blur
#     durationMs: 300             # 50..2000

server:
  # Extra WebSocket origins; only needed for the Vite dev server:
  # allowedOrigins: ["localhost:5173"]

connections: {}
  # Connections hold URLs and secrets and never reach the browser. Example:
  #
  # connections:
  #   vikunja:
  #     url: https://tasks.example.lan
  #     token: ${VIKUNJA_TOKEN}      # API token (Vikunja: Settings > API Tokens), provided as env var
  #     # Optional webhook receiver: POST /api/webhooks/vikunja/vikunja (the connection name) makes
  #     # the task widgets refresh within ~1 s instead of waiting for the poll. Both checks are
  #     # off unless set, and enforced once set (see WIDGETS.md):
  #     # webhookSecret: ${VIKUNJA_WEBHOOK_SECRET}   # the secret in Vikunja's webhook (X-Vikunja-Signature)
  #     # webhookUser: lumina                        # HTTP basic auth; put user:password into the webhook URL
  #     # webhookPassword: ${VIKUNJA_WEBHOOK_PASSWORD}
  #   family-calendar:               # one connection per calendar; the iCal address is a secret
  #     url: https://calendar.google.com/calendar/ical/XXXX/private-YYYY/basic.ics
  #                                  # Google: calendar settings > "Secret address in iCal format".
  #                                  # Treat it like a password. "file: /path/cal.ics" works too.
  #   holidays:
  #     url: https://calendar.google.com/calendar/ical/de.german%23holiday%40group.v.calendar.google.com/public/basic.ics
  #   grafana:
  #     url: https://grafana.example.lan
  #     token: ${GRAFANA_TOKEN}      # service account token, role Viewer (read-only)
  #   mqtt:
  #     url: mqtt.local:1883         # host[:port]; plain TCP by default (port 1883)
  #     # username: lumina           # optional login
  #     # password: ${MQTT_PASSWORD}
  #     # clientId: lumina           # optional; the widget id is appended so several widgets can share a connection. Default: lumina-<random>
  #     # tls: true                  # optional encryption (default port 8883); also implied by ssl:// or mqtts://
  #     # caFile: /certs/ca.pem      # optional: trust this CA instead of the system roots
  #     # insecureSkipVerify: true   # optional: accept any server certificate (self-signed brokers)
  #   tibber:                      # Tibber electricity prices (OAuth; get the refresh token with: go run ./cmd/tibber-auth)
  #     clientId: ${TIBBER_CLIENT_ID}
  #     clientSecret: ${TIBBER_CLIENT_SECRET}
  #     refreshToken: ${TIBBER_REFRESH_TOKEN}
  #     # tokenFile: /data/tibber-token.json   # where the rotated refresh token is kept (default: tibber-token.json)
  #   openhab:
  #     url: http://openhab.local:8080
  #     # token: ${OPENHAB_TOKEN}    # only if your openHAB requires an API token

pages:
  - id: home
    title: Home
    # home: true                  # optional, on at most one page: shows a house icon and returns
    #                             # to this page after 30 s without a touch (disables `rotate`)
    widgets:
      - id: clock-main
        type: core.clock
        pos: { x: 0, y: 0, w: 2, h: 1 }
        settings:
          showSeconds: false
      - id: weather
        type: weather.forecast
        pos: { x: 0, y: 1, w: 4, h: 3 }
        settings:
          location: Köln        # or: latitude: 50.94 / longitude: 6.96
          # label: Zuhause      # display name, defaults to the geocoded name
      - id: clock-utc
        type: core.clock
        pos: { x: 2, y: 0, w: 2, h: 1 }
        settings:
          timezone: UTC
          label: UTC

      # Vikunja task list (needs the connection above). Shows the open tasks, overdue first;
      # tap the circle to complete (with undo). Settings (all optional):
      #   projects: [Smarthome]    names or ids; a single project also enables "add task"
      #   labels: [home]           task must carry all of these labels
      #   due: all                 all | overdue | today | week (today/week include overdue)
      #   filter: "priority >= 3"  extra Vikunja filter expression
      #   limit: 50                max rows; "intervalSeconds: 60" poll interval (can be much
      #                            higher when the connection's webhook receiver is used)
      #   addProject: Inbox        target for "add task" if not exactly one project is set
      #   title / showProject      heading; project name per row (default: if several projects)
      # - id: tasks
      #   type: vikunja.tasks
      #   connection: vikunja
      #   readOnly: false          true hides the checkboxes and the add button
      #   pos: { x: 4, y: 0, w: 2, h: 4 }
      #   settings: { projects: [Smarthome], due: all }

      # openHAB: shows a sitemap natively (lights as tiles, mappings as buttons, values as
      # tiles, frames as headings, sliders for dimmers/blinds/setpoints) and updates live
      # from openHAB's event stream. Edit the dashboard by editing the sitemap. Switches,
      # mapping buttons and sliders can be operated; color pickers and selections are shown
      # read-only for now.
      #   sitemap: Favs      name of the openHAB sitemap (required)
      #   page: Favs         sub-page, defaults to the sitemap name
      #   title: Favoriten   defaults to the page title
      # - id: house
      #   type: openhab.sitemap
      #   connection: openhab
      #   readOnly: false    true: show states, no switching
      #   pos: { x: 0, y: 1, w: 4, h: 3 }
      #   settings: { sitemap: Favs }

      # Calendar: merges iCal feeds (Google secret address, Nextcloud, any .ics), expands
      # recurring events, handles time zones and all-day events. Read-only. Agenda list
      # grouped by day (running event highlighted); with enough room also a month overview
      # with colored dots.
      #   calendars: ...         list of connection names, or { connection, name, color }
      #   days: 1                how far ahead events are shown (1-60); an event counts if it starts within this range
      #   limit: 40              max agenda entries
      #   intervalMinutes: 10    refresh interval (feeds are fetched with conditional requests)
      #   weekStart: monday      monday | sunday
      #   showPast: false        keep today's finished events
      #   showMonth: true        default: automatic by card size
      # - id: calendar
      #   type: calendar.agenda
      #   pos: { x: 0, y: 0, w: 4, h: 4 }
      #   settings:
      #     title: Termine
      #     calendars:
      #       - { connection: family-calendar, name: Familie, color: "#f59e0b" }
      #       - holidays

      # Grafana: draws a panel of an existing dashboard natively as chart, stat, gauge or battery. The
      # widget re-runs the panel's queries through Grafana's query API, so every datasource
      # Grafana supports works, and it takes unit, thresholds, min/max and time range from the
      # panel (edit the panel in Grafana, the widget follows). Not supported: dashboard
      # variables in queries, and live/streaming datasources such as MQTT (use mqtt.value for those).
      #   dashboard: PV Uebersicht   dashboard uid or title        (panel mode)
      #   panel: Verbrauchswerte     panel id or title             (panel mode)
      #   datasource: InfluxDB       datasource uid or name        (query mode: instead of the two above)
      #   queries: [ { query: "..." } ]   Grafana query objects as in a panel's "targets"
      #   display: chart             chart | stat | gauge | battery, default from the panel type
      #   batteryStyle: classic      battery only: classic (solid, colored by charge) | minimal (thin outline, accent color)
      #   batteryValue: side         battery only: none | inline (in the icon) | side (next to it)
      #   batteryOrientation: horizontal   battery only: horizontal | vertical; the value is read as 0-100
      #   range: 6h                  e.g. 30m, 6h, 7d; default: the dashboard's range
      #   title / unit / decimals / min / max / legend   overrides
      #   intervalSeconds: 60        refresh interval (minimum 10)
      # - id: power
      #   type: grafana.panel
      #   connection: grafana
      #   pos: { x: 0, y: 0, w: 4, h: 2 }
      #   settings: { dashboard: "PV Uebersicht", panel: Verbrauchswerte, range: 24h }

      # MQTT: shows one numeric value of an MQTT topic as stat, gauge, chart or battery (broker, login and TLS
      # are set in the connection). The chart/sparkline covers what was received since the start.
      #   topic: victron/dc/soc      no wildcards
      #   valuePath: value           field of a JSON payload, e.g. data.soc; default: a plain number, or "value" of a JSON object
      #   display: stat              stat | gauge | chart | battery
      #   batteryStyle / batteryValue / batteryOrientation   battery only, as for grafana.panel
      #   range: 6h                  time range of the chart/sparkline
      #   title / unit / decimals / min / max   as for grafana.panel
      #   thresholds: [ { color: red }, { value: 20, color: green } ]
      # - id: battery
      #   type: mqtt.value
      #   connection: mqtt
      #   pos: { x: 4, y: 0, w: 2, h: 2 }
      #   settings: { topic: victron/dc/soc, title: Batterie, display: gauge, unit: percent, min: 0, max: 100 }
      # Tibber: current electricity price and a bar chart of the 15-minute prices of today and tomorrow.
      # Needs the `tibber` connection above. `home` (id or name) is only needed with several homes.
      # - id: strom
      #   type: tibber.prices
      #   connection: tibber
      #   pos: { x: 0, y: 0, w: 4, h: 3 }
      #   settings: { label: Strompreis }
